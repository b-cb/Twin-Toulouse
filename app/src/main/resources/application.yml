# Configuration du port du serveur
server:
  port: 8080

# Configuration globale de l'application Spring Boot
spring:
  application:
    name: jumeau-toulouse
  datasource:
    url: jdbc:h2:mem:tisseodb
    username: sa
    password: 
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

# Configuration métier personnalisée
tisseo:
  api:
    base-url: "https://api.tisseo.fr/v2"
    key: ${TISSEO_API_KEY}